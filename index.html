<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>Model Editor</title>
<style>
:root{--bg:#1e1f22;--panel:#2a2b2e;--field:#1a1b1d;--line:#3a3b40;--btn:#3a3b40;--text:#d9dadd;--muted:#8c8e94;--accent:#e8873a;--blue:#4772b3}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:12px/1.4 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled,select:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}
.app{height:100%;display:grid;grid-template-rows:44px minmax(0,1fr) 24px}
.top{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:13px;margin-right:10px}
.sp{flex:1}
.btn,select{height:28px;padding:0 10px;background:var(--btn);border:1px solid #4a4b51;border-radius:5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){background:#46474d}
.btn.primary,.btn.on,.seg button.on{background:var(--blue);border-color:#5f8bcf;color:#fff}
.btn.ico{width:28px;padding:0;justify-content:center;font-size:15px}
.main{display:grid;grid-template-columns:44px minmax(0,1fr) 290px;grid-template-rows:minmax(0,1fr) 112px;min-height:0}
.noside .main{grid-template-columns:44px minmax(0,1fr) 0}
.noside .side{display:none}
.tools{grid-row:1/3;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0}
.tools .btn{width:34px;height:34px;padding:0;justify-content:center}
.tools hr{width:24px;border:0;border-top:1px solid var(--line);margin:4px 0}
.viewer{position:relative;min-width:0;min-height:0;background:#2b2d31;overflow:hidden}
.viewer.dragover::after{content:"Drop to import";position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:8px;display:grid;place-items:center;font-size:16px;background:#e8873a1a;pointer-events:none}
#canvasHost{position:absolute;inset:0}
#canvasHost canvas{display:block;width:100%;height:100%}
.vbar{position:absolute;top:10px;left:10px;display:flex;gap:8px;pointer-events:none;flex-wrap:wrap}
.vbar.r{left:auto;right:10px}
.seg{display:inline-flex;pointer-events:auto;background:#1e1f22e6;border:1px solid #4a4b51;border-radius:5px;overflow:hidden}
.seg button{height:26px;padding:0 10px;border:0;background:none}
.seg button+button{border-left:1px solid #3a3b40}
.seg button:hover:not(.on){background:#3a3b40}
.welcome{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);text-align:center;width:min(380px,calc(100% - 32px))}
.welcome h1{font-size:20px;margin:0 0 6px}
.welcome p{color:var(--muted);margin:0 0 16px;font-size:13px}
.welcome .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#toast{position:absolute;top:48px;left:50%;transform:translateX(-50%);max-width:min(520px,calc(100% - 24px));background:#3a2626;border:1px solid #8a4b4b;border-radius:6px;padding:9px 12px;display:none;z-index:5;box-shadow:0 8px 24px #0006}
#toast.info{background:#26323f;border-color:#4f6a88}
.timeline{grid-column:2;grid-row:2;background:var(--panel);border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tl-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tl-row select{max-width:240px}
.time{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
#timeline{width:100%;margin:0;accent-color:var(--accent)}
.side{grid-column:3;grid-row:1/3;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.panel{padding:10px 12px;border-bottom:1px solid var(--line)}
.panel h2{font-size:12px;font-weight:650;margin:0 0 8px}
.outl{flex:1;min-height:0;display:flex;flex-direction:column}
.olist{flex:1;min-height:0;overflow:auto;margin:8px -12px -10px;scrollbar-color:#55565c transparent}
.orow{display:flex;align-items:center;gap:5px;height:24px;padding-right:8px;color:#c9cacf;white-space:nowrap}
.orow:hover{background:#34353a}
.orow.sel{background:#4a331f;color:#fff;box-shadow:inset 2px 0 var(--accent)}
.orow.off{opacity:.45}
.caret{width:10px;color:var(--muted);text-align:center}
.k{color:var(--muted);width:14px;text-align:center}
.nm{flex:1;overflow:hidden;text-overflow:ellipsis}
.eye{border:0;background:none;color:var(--muted);padding:0 2px}
.empty{color:var(--muted);padding:6px 12px;margin:0;line-height:1.6}
.panel .empty{padding:0}
input[type=number],.name,.search{background:var(--field);border:1px solid var(--line);border-radius:4px;height:26px;padding:0 6px;width:100%;min-width:0}
.name{margin-bottom:8px}
.row{display:grid;grid-template-columns:54px repeat(3,1fr);gap:4px;align-items:center;margin-bottom:5px;color:var(--muted);font-size:11px}
.kv{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted)}
.kv b{font-weight:500;color:var(--text);font-variant-numeric:tabular-nums}
.status{display:flex;align-items:center;gap:12px;padding:0 10px;background:var(--panel);border-top:1px solid var(--line);color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden}
.dot{width:7px;height:7px;border-radius:50%;background:#6fae85}
#selLabel{color:var(--accent)}
@media(max-width:720px){.main{grid-template-columns:44px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 112px 200px}.side{grid-column:1/3;grid-row:3;border-left:0;border-top:1px solid var(--line)}.brand span,#folderTop,#shotBtn,.hint{display:none}.vbar.r{top:44px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 24 24"><path d="m12 2 9 5v10l-9 5-9-5V7z"/><path d="m3 7 9 5 9-5M12 12v10"/></svg><span>Model Editor</span></div>
    <button class="btn primary" id="importTop">Import</button>
    <button class="btn" id="folderTop">Open folder</button>
    <button class="btn" id="exportBtn" disabled title="Export the edited model as GLB">Export GLB</button>
    <button class="btn" id="shotBtn" title="Save a PNG of the viewport">Screenshot</button>
    <span class="sp"></span>
    <button class="btn ico" id="undoBtn" disabled title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
    <button class="btn ico" id="redoBtn" disabled title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button>
  </header>
  <div class="main">
    <nav class="tools" aria-label="Tools">
      <button class="btn on" data-tool="select" title="Select (Q)" aria-label="Select"><svg viewBox="0 0 24 24"><path d="m5 3 14 8-6 2-2 6z"/></svg></button>
      <button class="btn" data-tool="translate" title="Move (G)" aria-label="Move"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg></button>
      <button class="btn" data-tool="rotate" title="Rotate (R)" aria-label="Rotate"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3-6.2M20 4v5h-5"/></svg></button>
      <button class="btn" data-tool="scale" title="Scale (S)" aria-label="Scale"><svg viewBox="0 0 24 24"><path d="M4 20 20 4M14 4h6v6M10 20H4v-6"/></svg></button>
      <hr>
      <button class="btn" id="snapBtn" title="Snap to steps" aria-label="Snap"><svg viewBox="0 0 24 24"><path d="M6 3v8a6 6 0 0 0 12 0V3h-4v8a2 2 0 0 1-4 0V3z"/></svg></button>
      <button class="btn" id="frameBtn" title="Frame selected (F)" aria-label="Frame selected"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
    </nav>
    <main class="viewer" id="viewer">
      <div id="canvasHost"></div>
      <div class="vbar">
        <div class="seg"><button data-shade="material" class="on">Material</button><button data-shade="solid">Solid</button><button data-shade="wire">Wire</button></div>
        <div class="seg"><button id="gridBtn" class="on">Grid</button><button id="skelBtn">Bones</button><button id="rotBtn">Spin</button></div>
      </div>
      <div class="vbar r"><div class="seg"><button data-view="0,0,1">Front</button><button data-view="1,0,0">Right</button><button data-view="0,1,.001">Top</button><button id="resetBtn" title="Reset view (Home)">Reset</button></div></div>
      <div class="welcome" id="welcome">
        <h1>Drop a model to start editing</h1>
        <p>FBX, GLB, GLTF, OBJ, STL or Blender (.blend). Textures and .bin files can be dropped together with the model.</p>
        <div class="acts"><button class="btn primary" id="importWelcome">Import model</button><button class="btn" id="folderWelcome">Open folder</button><button class="btn" id="demoButton">Try demo</button></div>
      </div>
      <div id="toast" role="alert"></div>
    </main>
    <section class="timeline" aria-label="Animation timeline">
      <div class="tl-row">
        <select id="clipSelect" disabled aria-label="Animation clip"></select>
        <button class="btn ico" id="restartButton" title="Jump to start" aria-label="Jump to start" disabled>⏮</button>
        <button class="btn ico" id="stepBack" title="Back one frame (←)" aria-label="Back one frame" disabled>◂</button>
        <button class="btn primary" id="playButton" style="min-width:84px;justify-content:center" disabled title="Play / pause (Space)">▶ Play</button>
        <button class="btn ico" id="stepFwd" title="Forward one frame (→)" aria-label="Forward one frame" disabled>▸</button>
        <button class="btn on" id="loopButton" aria-pressed="true" disabled>Loop</button>
        <select id="speedSelect" disabled aria-label="Playback speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
        <span class="time" id="timeText">0.00s / 0.00s · frame 0</span>
      </div>
      <input type="range" id="timeline" min="0" max="1000" step="1" value="0" disabled aria-label="Animation time">
    </section>
    <aside class="side">
      <section class="panel outl"><h2>Outliner</h2><input class="search" id="filter" placeholder="Search objects" aria-label="Search objects"><div class="olist" id="outliner"></div></section>
      <section class="panel" id="propsPanel"><h2>Properties</h2><div id="props"></div></section>
    </aside>
  </div>
  <footer class="status"><span class="dot" id="statusDot"></span><span id="statusLabel">Ready</span><span id="selLabel"></span><span class="sp"></span><span id="stats"></span><span class="hint">Q select · G move · R rotate · S scale · F frame · H hide · N panel</span></footer>
</div>
<input id="fileInput" type="file" accept=".fbx,.glb,.gltf,.obj,.stl,.blend,.mtl,.bin,.png,.jpg,.jpeg,.webp,.tga,.bmp,.gif,.ktx2" multiple hidden>
<input id="folderInput" type="file" webkitdirectory directory multiple hidden>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { TransformControls } from 'three/addons/controls/TransformControls.js';
  import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
  import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
  import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
  import { STLLoader } from 'three/addons/loaders/STLLoader.js';
  import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

  const $ = (id) => document.getElementById(id);
  const supported = new Set(['glb', 'gltf', 'fbx', 'obj', 'stl', 'blend']);
  const viewer = $('viewer');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.3;
  $('canvasHost').appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x2b2d31);
  const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 10000);
  camera.position.set(5.6, 3.8, 6.4);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 0.05;
  controls.maxDistance = 300;
  scene.add(new THREE.HemisphereLight(0xe2f0ff, 0x5b6170, 2.6));
  const sun = new THREE.DirectionalLight(0xffffff, 3.1); sun.position.set(5, 9, 7); scene.add(sun);
  const rim = new THREE.DirectionalLight(0x9bbded, 1.7); rim.position.set(-7, 5, -7); scene.add(rim);
  const grid = new THREE.GridHelper(100, 100, 0x4a4d54, 0x383b41);
  scene.add(grid);

  const tc = new TransformControls(camera, renderer.domElement);
  const tcHelper = tc.getHelper();
  scene.add(tcHelper);
  const box = new THREE.BoxHelper(new THREE.Object3D(), 0xe8873a);
  box.material.depthTest = false; box.visible = false; scene.add(box);

  let modelFrame = null, modelRoot = null, skeletonHelper = null, mixer = null, info = null;
  let clips = [], activeAction = null, activeIndex = -1, playing = false, loop = true, speed = 1;
  let assetUrls = [], loadTicket = 0, toastTimeout;
  let selected = null, tool = 'select', shading = 'material', past = [], future = [], dragBefore = null;
  const expanded = new Set();
  const clock = new THREE.Clock();
  const clay = new THREE.MeshStandardMaterial({ color: 0xb9bcc2, roughness: 0.8, side: THREE.DoubleSide });
  const wireM = new THREE.MeshBasicMaterial({ color: 0xcfd3da, wireframe: true });

  const ext = (name) => String(name).split('.').pop().toLowerCase();
  const safeText = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function showToast(message, isInfo = false) {
    const t = $('toast');
    t.textContent = message; t.classList.toggle('info', isInfo); t.style.display = 'block';
    clearTimeout(toastTimeout); toastTimeout = setTimeout(() => { t.style.display = 'none'; }, 7000);
  }
  function setStatus(message, loading = false) {
    $('statusLabel').textContent = message;
    $('statusDot').style.background = loading ? '#e5ae73' : '#6fae85';
  }
  function download(blob, name) {
    const a = document.createElement('a');
    a.href = blob instanceof Blob ? URL.createObjectURL(blob) : blob; a.download = name; a.click();
    if (blob instanceof Blob) setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  function resize() {
    const w = Math.max(1, viewer.clientWidth), h = Math.max(1, viewer.clientHeight);
    camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h);
  }
  new ResizeObserver(resize).observe(viewer); resize();

  /* ---------- camera ---------- */
  function frame(o) {
    const t = o || modelFrame;
    if (!t) return;
    const b = new THREE.Box3().setFromObject(t);
    if (b.isEmpty()) b.setFromCenterAndSize(t.getWorldPosition(new THREE.Vector3()), new THREE.Vector3(.4, .4, .4));
    const c = b.getCenter(new THREE.Vector3()), r = Math.max(b.getSize(new THREE.Vector3()).length() / 2, 0.05);
    const dir = camera.position.clone().sub(controls.target).normalize();
    controls.target.copy(c);
    camera.position.copy(c).addScaledVector(dir, r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.1);
    controls.update();
  }
  function resetView() {
    controls.target.set(0, 0, 0); camera.position.set(5.6, 3.8, 6.4); controls.update();
    if (modelFrame) frame(modelFrame);
  }
  function setView(dir) {
    const d = camera.position.distanceTo(controls.target);
    camera.position.copy(controls.target).addScaledVector(dir.normalize(), d); controls.update();
  }

  /* ---------- undo / redo ---------- */
  const snapOf = (o) => ({ p: o.position.clone(), q: o.quaternion.clone(), s: o.scale.clone() });
  const restore = (o, s) => { o.position.copy(s.p); o.quaternion.copy(s.q); o.scale.copy(s.s); };
  function commit(undoFn, redoFn) { past.push({ undoFn, redoFn }); if (past.length > 100) past.shift(); future = []; updateHistoryUi(); }
  function commitTransform(o, before) {
    const after = snapOf(o);
    if (before.p.equals(after.p) && before.q.equals(after.q) && before.s.equals(after.s)) return;
    commit(() => restore(o, before), () => restore(o, after));
  }
  function updateHistoryUi() { $('undoBtn').disabled = !past.length; $('redoBtn').disabled = !future.length; }
  function stepHistory(from, to, key) {
    const c = from.pop(); if (!c) return;
    c[key](); to.push(c); updateHistoryUi();
    if (selected) box.update(); renderProps(); renderOutliner();
  }
  const undo = () => stepHistory(past, future, 'undoFn');
  const redo = () => stepHistory(future, past, 'redoFn');

  /* ---------- tools & selection ---------- */
  function setTool(t) {
    tool = t;
    document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
    if (t === 'select') tc.detach(); else { tc.setMode(t); if (selected) tc.attach(selected); }
  }
  function select(o) {
    selected = o || null;
    if (selected) {
      box.setFromObject(selected); box.visible = true;
      if (tool !== 'select') tc.attach(selected);
      for (let p = selected.parent; p; p = p.parent) expanded.add(p.uuid);
    } else { box.visible = false; tc.detach(); }
    $('selLabel').textContent = selected ? (selected.name || selected.type) : '';
    renderOutliner(); renderProps();
  }
  tc.addEventListener('dragging-changed', (e) => {
    controls.enabled = !e.value;
    if (e.value) { dragBefore = snapOf(tc.object); if (playing) togglePlay(false); }
    else if (tc.object && dragBefore) commitTransform(tc.object, dragBefore);
  });
  tc.addEventListener('objectChange', () => renderProps());

  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  let down = null;
  renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY, tc.axis]; });
  renderer.domElement.addEventListener('pointerup', e => {
    if (!down || !modelRoot || e.button !== 0) return;
    const skip = Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4 || down[2];
    down = null; if (skip) return;
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObject(modelRoot, true).find(h => h.object.isMesh && h.object.visible);
    select(hit ? hit.object : null);
  });
  function deleteSelected() {
    const o = selected;
    if (!o || o === modelRoot || !o.parent) return;
    const p = o.parent;
    const redoFn = () => { p.remove(o); if (selected === o) select(null); else renderOutliner(); };
    redoFn(); commit(() => { p.add(o); renderOutliner(); }, redoFn);
  }

  /* ---------- shading ---------- */
  function applyShading() {
    if (!modelRoot) return;
    modelRoot.traverse(o => {
      if (!o.isMesh) return;
      o.userData.mat ??= o.material;
      o.material = shading === 'solid' ? clay : shading === 'wire' ? wireM : o.userData.mat;
    });
  }

  /* ---------- outliner ---------- */
  const ICON = { mesh: '▣', bone: '╱', group: '▢', light: '✦', cam: '▷' };
  const kind = (o) => o.isBone ? 'bone' : o.isMesh ? 'mesh' : o.isLight ? 'light' : o.isCamera ? 'cam' : 'group';
  function orow(o, depth, hasKids, open) {
    const d = document.createElement('div');
    d.className = 'orow' + (o === selected ? ' sel' : '') + (o.visible ? '' : ' off');
    d.style.paddingLeft = (10 + depth * 14) + 'px';
    d.innerHTML = `<span class="caret">${hasKids ? (open ? '▾' : '▸') : ''}</span><span class="k">${ICON[kind(o)]}</span><span class="nm">${safeText(o.name || o.type)}</span><button class="eye" title="Show / hide (H)" aria-label="Toggle visibility">${o.visible ? '◉' : '○'}</button>`;
    d.onclick = (e) => {
      if (e.target.closest('.eye')) { o.visible = !o.visible; renderOutliner(); return; }
      if (hasKids && e.target.classList.contains('caret')) { open ? expanded.delete(o.uuid) : expanded.add(o.uuid); renderOutliner(); return; }
      select(o);
    };
    d.ondblclick = () => frame(o);
    return d;
  }
  function renderOutliner() {
    const list = $('outliner'); list.replaceChildren();
    if (!modelRoot) { list.innerHTML = '<p class="empty">The scene is empty. Import a model to begin.</p>'; return; }
    const q = $('filter').value.trim().toLowerCase(), frag = document.createDocumentFragment();
    (function walk(o, d) {
      const open = expanded.has(o.uuid);
      if (!q || (o.name || o.type).toLowerCase().includes(q)) frag.appendChild(orow(o, q ? 0 : d, !q && o.children.length > 0, open));
      if (q || open) o.children.forEach(c => walk(c, d + 1));
    })(modelRoot, 0);
    list.appendChild(frag);
    list.querySelector('.sel')?.scrollIntoView({ block: 'nearest' });
  }
  $('filter').addEventListener('input', renderOutliner);

  /* ---------- properties ---------- */
  const kv = (a, b) => `<div class="kv"><span>${a}</span><b>${b}</b></div>`;
  function renderProps() {
    const el = $('props'), o = selected;
    if (!o) {
      el.innerHTML = info

    if (mods) notes.push(`${mods} modifier${mods > 1 ? 's' : ''} not applied (base meshes shown)`);
    const skipped = Object.entries(sc.skipped).filter(([k]) => !k.startsWith('MESH')).map(([k, n]) => `${n} ${k.toLowerCase()}`);
    const broken = Object.keys(sc.skipped).filter(k => k.startsWith('MESH'));
    if (skipped.length) notes.push('skipped ' + skipped.join(', '));
    if (broken.length) notes.push(`${broken.length} mesh${broken.length > 1 ? 'es' : ''} unreadable`);
    if (built.detached) notes.push(`${built.detached} child object${built.detached > 1 ? 's' : ''} detached from a non-uniformly scaled parent to keep their placement`);
    const ver = Math.floor(B.version / 100) + '.' + (B.version % 100);
    return { root: built.root, message: `Imported from Blender ${ver}. Meshes, materials, UVs and hierarchy are loaded; animation and image textures are not.` + (notes.length ? ' Note: ' + notes.join('; ') + '.' : '') };
  }

  async function loadFiles(rawFiles) {
    const files = Array.from(rawFiles || []).filter(Boolean);
    if (!files.length) return;
    const main = files.find(file => supported.has(ext(file.name)));
    if (!main) { showToast('No supported model found. Please select a .fbx, .glb, .gltf, .obj, .stl or .blend file.'); return; }
    const ticket = ++loadTicket;
    setStatus(`Loading ${main.name}…`, true);
    $('statusDot').style.background = '#e5ae73';
    const start = performance.now();
    try {
      const previousUrls = assetUrls;
      assetUrls = [];
      const manager = buildAssets(files);
      const format = ext(main.name);
      let root, animations = [], blendMessage = '';
      if (format === 'glb' || format === 'gltf') {
        const loader = new GLTFLoader(manager);
        const draco = new DRACOLoader();
        draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/draco/');
        loader.setDRACOLoader(draco);
        const data = format === 'glb' ? await main.arrayBuffer() : await main.text();
        const gltf = await loader.parseAsync(data, '');
        root = gltf.scene;
        animations = gltf.animations || [];
        draco.dispose();
      } else if (format === 'fbx') {
        const loader = new FBXLoader(manager);
        const buffer = await main.arrayBuffer();
        const parsed = parseFBXWithTextureFallback(loader, buffer);
        root = parsed.root;
        animations = root.animations || [];
        if (parsed.usedFallback) {
          showToast(`FBX repaired: corrected ${parsed.patchedPropertyNodes} property nodes and skipped ${parsed.removedNodes} broken texture/video entries. Geometry and animation data were kept.`, true);
        }
      } else if (format === 'obj') {
        const loader = new OBJLoader(manager);
        const mtlFile = files.find(file => ext(file.name) === 'mtl');
        if (mtlFile) {
          const mtlLoader = new MTLLoader(manager);
          const materials = mtlLoader.parse(await mtlFile.text(), '');
          materials.preload();
          loader.setMaterials(materials);
        }
        root = loader.parse(await main.text());
      } else if (format === 'stl') {
        const geometry = new STLLoader(manager).parse(await main.arrayBuffer());
        root = new THREE.Group();
        root.add(new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color:0xb3c5db, roughness:0.72, metalness:0.1, side:THREE.DoubleSide })));
      } else if (format === 'blend') {
        const res = await loadBlend(main);
        root = res.root; blendMessage = res.message;
      }
      if (ticket !== loadTicket) return;
      if (!root) throw new Error('The model did not contain a scene.');
      for (const url of previousUrls) URL.revokeObjectURL(url);
      installModel(root, animations, main.name, main.size);
      if (blendMessage) showToast(blendMessage, true);
      console.info(`Loaded ${main.name} in ${Math.round(performance.now() - start)}ms`);
    } catch (error) {
      if (ticket !== loadTicket) return;
      console.error(error);
      setStatus(modelRoot ? 'Previous model retained' : 'Import failed');
      showToast(`Could not open ${main.name}: ${error?.message || 'Unsupported or invalid file.'}`);
    }
  }

  $('demoButton').addEventListener('click', () => {
    const group = new THREE.Group();
    const blue = new THREE.MeshStandardMaterial({ color:0x89b9f3, roughness:0.5, metalness:0.1 });
    const dark = new THREE.MeshStandardMaterial({ color:0x38485c, roughness:0.65 });
    const joint = new THREE.MeshStandardMaterial({ color:0xd4e4fa, roughness:0.4, metalness:0.3 });
    function part(name, geom, material, pos, parent = group) {
      const mesh = new THREE.Mesh(geom, material);
      mesh.name = name;
      mesh.position.set(...pos);
      parent.add(mesh);
      return mesh;
    }
    part('Body',new THREE.BoxGeometry(1,1.15,.57), blue,[0,1.2,0]);
    part('Head',new THREE.BoxGeometry(.72,.67,.64), blue,[0,2.16,0]);
    part('LeftEye',new THREE.BoxGeometry(.1,.1,.04),dark,[-.17,2.23,.33]);
    part('RightEye',new THREE.BoxGeometry(.1,.1,.04),dark,[.17,2.23,.33]);
    part('LeftLeg',new THREE.BoxGeometry(.35,.87,.42),dark,[-.28,.36,0]);
    part('RightLeg',new THREE.BoxGeometry(.35,.87,.42),dark,[.28,.36,0]);
    part('LeftArm',new THREE.BoxGeometry(.3,.95,.35),joint,[-.8,1.25,0]);
    part('RightArm',new THREE.BoxGeometry(.3,.95,.35),joint,[.8,1.25,0]);
    const bounce = new THREE.AnimationClip('Bounce',2, [
      new THREE.VectorKeyframeTrack('Body.position', [0,.5,1,1.5,2],[0,1.2,0,0,1.36,0,0,1.56,0,0,1.36,0,0,1.2,0]),
      new THREE.VectorKeyframeTrack('Head.position', [0,.5,1,1.5,2],[0,2.16,0,0,2.32,0,0,2.52,0,0,2.32,0,0,2.16,0])
    ]);
    const wave = new THREE.AnimationClip('Wave',2.4,[
      new THREE.QuaternionKeyframeTrack('RightArm.quaternion',[0,.6,1.2,1.8,2.4],Array.from({length:5},(_,i) => new THREE.Quaternion().setFromEuler(new THREE.Euler(0,0,[0,-1.2,-.5,-1.2,0][i])).toArray()).flat())
    ]);
    installModel(group,[bounce,wave],'Demo Robot.glb',0);
    showToast('Demo loaded. Pick Bounce or Wave from the timeline menu.', true);
  });

  /* ---------- wiring ---------- */
  const fileInput = $('fileInput'), folderInput = $('folderInput');
  const openFiles = () => { fileInput.value = ''; fileInput.click(); };
  const openFolder = () => { folderInput.value = ''; folderInput.click(); };
  fileInput.addEventListener('change', e => loadFiles(e.target.files));
  folderInput.addEventListener('change', e => loadFiles(e.target.files));
  for (const id of ['importTop', 'importWelcome']) $(id).onclick = openFiles;
  for (const id of ['folderTop', 'folderWelcome']) $(id).onclick = openFolder;
  let dragCounter = 0;
  document.addEventListener('dragenter', e => { e.preventDefault(); dragCounter++; viewer.classList.add('dragover'); });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('dragleave', e => { e.preventDefault(); dragCounter = Math.max(0, dragCounter - 1); if (!dragCounter) viewer.classList.remove('dragover'); });
  document.addEventListener('drop', e => {
    e.preventDefault(); dragCounter = 0; viewer.classList.remove('dragover');
    if (e.dataTransfer?.files?.length) loadFiles(e.dataTransfer.files);
  });

  document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
  document.querySelectorAll('[data-shade]').forEach(b => b.onclick = () => {
    shading = b.dataset.shade;
    document.querySelectorAll('[data-shade]').forEach(x => x.classList.toggle('on', x === b));
    applyShading();
  });
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(new THREE.Vector3(...b.dataset.view.split(',').map(Number))));
  function flip(id, fn) { const b = $(id); b.onclick = () => { b.classList.toggle('on'); fn(b.classList.contains('on')); }; }
  flip('gridBtn', v => { grid.visible = v; });
  flip('skelBtn', v => { if (skeletonHelper) skeletonHelper.visible = v; });
  flip('rotBtn', v => { controls.autoRotate = v; });
  flip('snapBtn', v => {
    tc.setTranslationSnap(v ? 0.1 : null); tc.setRotationSnap(v ? THREE.MathUtils.degToRad(15) : null); tc.setScaleSnap(v ? 0.1 : null);
  });
  $('resetBtn').onclick = resetView;
  $('frameBtn').onclick = () => frame(selected);
  $('undoBtn').onclick = undo;
  $('redoBtn').onclick = redo;

  $('clipSelect').onchange = e => selectClip(+e.target.value, true);
  $('playButton').onclick = () => togglePlay();
  $('restartButton').onclick = () => { if (!activeAction) return; activeAction.reset().play(); activeAction.paused = !playing; mixer.update(0); updateTimeline(); };
  $('stepBack').onclick = () => stepFrame(-1);
  $('stepFwd').onclick = () => stepFrame(1);
  $('loopButton').onclick = () => {
    loop = !loop;
    if (activeAction) { activeAction.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, loop ? Infinity : 1); activeAction.clampWhenFinished = true; }
    updatePlaybackUi();
  };
  $('speedSelect').onchange = e => { speed = Number(e.target.value) || 1; };
  $('timeline').oninput = e => {
    if (!activeAction) return;
    const d = clips[activeIndex].duration, t = Number(e.target.value) / 1000 * d;
    if (!loop && activeAction.time >= d - 0.001 && t < d - 0.001) activeAction.reset().play();
    activeAction.time = t; mixer.update(0); updateTimeline();
  };

  $('exportBtn').onclick = () => {
    if (!modelRoot) return;
    setStatus('Exporting…', true);
    new GLTFExporter().parse(modelRoot, result => {
      download(new Blob([result], { type: 'model/gltf-binary' }), (info.filename.replace(/\.[^.]+$/, '') || 'model') + '-edited.glb');
      setStatus('Exported GLB');
    }, err => { setStatus('Export failed'); showToast('Could not export: ' + (err?.message || err)); }, { binary: true, animations: clips });
  };
  $('shotBtn').onclick = () => {
    const g = grid.visible, b = box.visible;
    tcHelper.visible = box.visible = grid.visible = false;
    renderer.render(scene, camera);
    const url = renderer.domElement.toDataURL('image/png');
    tcHelper.visible = true; box.visible = b; grid.visible = g;
    download(url, 'screenshot.png');
  };

  /* ---------- keyboard ---------- */
  const keys = {
    q: () => setTool('select'), g: () => setTool('translate'), r: () => setTool('rotate'), s: () => setTool('scale'),
    f: () => frame(selected), home: resetView,
    '1': () => $('viewer').querySelector('[data-view="0,0,1"]').click(),
    '3': () => $('viewer').querySelector('[data-view="1,0,0"]').click(),
    '7': () => $('viewer').querySelector('[data-view="0,1,.001"]').click(),
    ' ': () => togglePlay(), arrowleft: () => stepFrame(-1), arrowright: () => stepFrame(1),
    h: () => { if (selected) { selected.visible = !selected.visible; renderOutliner(); } },
    delete: deleteSelected, backspace: deleteSelected, escape: () => select(null),
    n: () => { $('app').classList.toggle('noside'); }
  };
  addEventListener('keydown', e => {
    if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) && e.target.type !== 'range') return;
    const k = e.key.toLowerCase();
    if (e.ctrlKey || e.metaKey) {
      if (k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
      else if (k === 'y') { e.preventDefault(); redo(); }
      return;
    }
    if (keys[k]) { e.preventDefault(); keys[k](); }
  });
  addEventListener('keyup', e => { if (e.key === ' ' && !/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) e.preventDefault(); });

  function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.1);
    if (mixer && activeAction && playing) { mixer.update(delta * speed); updateTimeline(); }
    if (selected && box.visible) box.update();
    controls.update();
    renderer.render(scene, camera);
  }
  renderProps(); renderOutliner(); renderClips(); updatePlaybackUi();
  animate();
</script>
</body>
</html>
